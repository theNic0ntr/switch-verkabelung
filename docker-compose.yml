services:
  switch-verkabelung:
    build: .
    image: switch-verkabelung:latest
    container_name: switch-verkabelung
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - daten:/data
    environment:
      TZ: Europe/Berlin
      # Anmeldung (HTTP Basic Auth) – dringend empfohlen, sobald der Server nicht nur lokal erreichbar ist.
      # Je Person name:passwort, mehrere durch Komma getrennt; der Name erscheint bei den anderen am Mauszeiger:
      # AUTH_USERS: "nico:bitte-ein-langes-passwort,anna:noch-ein-langes-passwort"

volumes:
  daten:
