services:
  switch-verkabelung:
    build: .
    image: switch-verkabelung:latest
    container_name: switch-verkabelung
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - daten:/data
    environment:
      TZ: Europe/Berlin
      # Anmeldung (HTTP Basic Auth) – dringend empfohlen, sobald der Server nicht nur lokal erreichbar ist:
      # AUTH_USER: admin
      # AUTH_PASSWORD: bitte-ein-langes-passwort

volumes:
  daten:
